[[effect]]
key = "motion"
name = "Motion (formerly Framer Motion)"
library = "Motion"
url = "https://motion.dev/"
package = "motion"
version = "14.0.0"
license = "MIT"
category = "micro"
stacks = ["react", "vanilla", "vue"]
vibes = ["calm", "playful", "techy", "editorial"]
cost = "medium"
use_when = "UI motion in React: enter/exit, layout animations, shared-element transitions, gestures, springs, scroll-linked values."
avoid_when = "Pure CSS transitions or scroll-driven animations already cover it."
a11y = "<MotionConfig reducedMotion='user'> disables transform/layout animation for users who ask."
perf = "Use LazyMotion + m components to cut bundle size; animate transform and opacity."
react = '''
import { motion, MotionConfig } from 'motion/react'

<MotionConfig reducedMotion="user">
  <motion.h1
    initial={{ opacity: 0, y: 16, filter: 'blur(6px)' }}
    animate={{ opacity: 1, y: 0, filter: 'blur(0px)' }}
    transition={{ duration: 0.6, ease: [0.22, 1, 0.36, 1] }}
  >
    Ship faster
  </motion.h1>
</MotionConfig>
'''
vanilla = '''
import { animate, inView } from 'motion'

if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  inView('.reveal', (el) => {
    animate(el, { opacity: [0, 1], y: [24, 0] }, { duration: 0.6, ease: [0.22, 1, 0.36, 1] })
  })
}
'''

[[effect]]
key = "gsap"
name = "GSAP + ScrollTrigger + SplitText"
library = "GSAP"
url = "https://gsap.com/docs/v3/"
package = "gsap"
version = "3.15.0"
license = "Free for commercial use, including all plugins (since 3.13, Webflow)"
category = "scroll"
stacks = ["vanilla", "react", "vue"]
vibes = ["dramatic", "bold", "editorial", "playful", "luxe"]
cost = "medium"
use_when = "Choreographed timelines, pinned scroll storytelling, split-text reveals, Flip layout transitions, SVG morphing."
avoid_when = "Simple fades; CSS or Motion is lighter."
a11y = "Wrap everything in gsap.matchMedia('(prefers-reduced-motion: no-preference)'). Never hide content until JS runs without a no-JS fallback."
perf = "Animate transforms; kill ScrollTriggers on route change (useGSAP does this in React)."
vanilla = '''
import gsap from 'gsap'
import { ScrollTrigger } from 'gsap/ScrollTrigger'
import { SplitText } from 'gsap/SplitText'
gsap.registerPlugin(ScrollTrigger, SplitText)

const mm = gsap.matchMedia()
mm.add('(prefers-reduced-motion: no-preference)', () => {
  const split = SplitText.create('.hero h1', { type: 'lines', mask: 'lines' })
  gsap.from(split.lines, { yPercent: 100, duration: 0.9, ease: 'expo.out', stagger: 0.08 })

  gsap.utils.toArray('.reveal').forEach((el) => {
    gsap.from(el, {
      y: 40, autoAlpha: 0, duration: 0.8, ease: 'power3.out',
      scrollTrigger: { trigger: el, start: 'top 85%' },
    })
  })
})
'''
react = '''
import gsap from 'gsap'
import { useGSAP } from '@gsap/react'
import { ScrollTrigger } from 'gsap/ScrollTrigger'
gsap.registerPlugin(useGSAP, ScrollTrigger)

function Section() {
  const ref = useRef(null)
  useGSAP(() => {
    gsap.matchMedia().add('(prefers-reduced-motion: no-preference)', () => {
      gsap.from('.card', { y: 40, autoAlpha: 0, stagger: 0.08,
        scrollTrigger: { trigger: ref.current, start: 'top 75%' } })
    })
  }, { scope: ref })
  return <section ref={ref}>...</section>
}
'''

