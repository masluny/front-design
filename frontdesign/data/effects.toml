# Catalog of modern visual effects and motion libraries.
#
# Every snippet was checked against the library's docs or published package on the date in
# `checked`. Libraries move fast (Paper Shaders ships breaking changes under 0.0.x), so the
# agent must pin the version it installs and re-check props on the docs page before use.
#
# category: background | hero | text | scroll | micro | 3d | data | transition | image-filter |
#           logo | components | css
# vibes:    calm, luxe, techy, playful, editorial, organic, retro, brutalist, bold, dramatic, warm
# cost:     light (< ~15 kB, cheap to render) | medium | heavy (three.js-class bundle or full-screen GPU)
# stacks:   react | vanilla | vue | any (plain HTML/CSS)
#
# Rules the agent must follow for every effect (repeated in SKILL.md):
#   1. One signature effect per page, at most two supporting ones.
#   2. prefers-reduced-motion: stop or remove motion (speed 0 / static frame / no smooth scroll).
#   3. Decorative canvases get aria-hidden="true" and never carry content.
#   4. Text over an effect must pass contrast against the effect's lightest/darkest frame
#      (`front-design audit` samples real pixels).
#   5. Lazy-load below-the-fold effects; cap DPR; keep LCP an image or text, not a canvas.

checked = "2026-10-06"

[helpers]
use_reduced_motion = '''
// useReducedMotion: SSR-safe React hook (motion/react also exports one)
import { useEffect, useState } from 'react'

export function useReducedMotion() {
  const [reduce, setReduce] = useState(false)
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)')
    const update = () => setReduce(mq.matches)
    update()
    mq.addEventListener('change', update)
    return () => mq.removeEventListener('change', update)
  }, [])
  return reduce
}
'''

# ================================================================ Paper Shaders

[[effect]]
key = "paper-mesh-gradient"
name = "Mesh Gradient"
library = "Paper Shaders"
url = "https://shaders.paper.design/mesh-gradient"
package = "@paper-design/shaders-react"
version = "0.0.81"
license = "Apache-2.0 (commercial use OK, no visible attribution needed)"
category = "background"
stacks = ["react", "vanilla"]
vibes = ["calm", "luxe", "organic", "techy", "warm"]
cost = "light"
use_when = "A soft, living brand backdrop for a hero or a full-bleed section; Stripe-like premium calm."
avoid_when = "Behind long body text, or when the brand palette has fewer than 3 usable colors."
a11y = "Wrap in aria-hidden. Use speed 0 for reduced motion (renders one static frame)."
perf = "Zero-dependency WebGL on one canvas; pauses offscreen via IntersectionObserver. Pin the version."
react = '''
'use client' // Next.js App Router: shaders run on the client
import { MeshGradient } from '@paper-design/shaders-react'
import { useReducedMotion } from './useReducedMotion'

export function HeroBackground() {
  const reduce = useReducedMotion()
  return (
    <div aria-hidden="true" style={{ position: 'absolute', inset: 0, zIndex: -1 }}>
      <MeshGradient
        colors={['#0b0b10', '#2b2bff', '#ff6a3d', '#f4efe6']} // up to 10 brand colors
        distortion={0.8}   // 0..1 organic noise
        swirl={0.1}        // 0..1 vortex
        grainMixer={0}     // 0..1 grain on shape edges
        grainOverlay={0.15} // 0..1 film grain
        speed={reduce ? 0 : 0.25}
        style={{ width: '100%', height: '100%' }}
      />
    </div>
  )
}
'''
vanilla = '''
<div id="hero-bg" aria-hidden="true" style="position:absolute;inset:0;z-index:-1"></div>
<script type="module">
  import { ShaderMount, meshGradientFragmentShader, getShaderColorFromString, ShaderFitOptions }
    from 'https://cdn.jsdelivr.net/npm/@paper-design/shaders@0.0.81/+esm'

  const colors = ['#0b0b10', '#2b2bff', '#ff6a3d', '#f4efe6'].map(getShaderColorFromString)
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  new ShaderMount(
    document.getElementById('hero-bg'),
    meshGradientFragmentShader,
    {
      u_colors: colors, u_colorsCount: colors.length,
      u_distortion: 0.8, u_swirl: 0.1, u_grainMixer: 0, u_grainOverlay: 0.15,
      // sizing uniforms (pattern defaults)
      u_fit: ShaderFitOptions.none, u_scale: 1, u_rotation: 0,
      u_originX: 0.5, u_originY: 0.5, u_offsetX: 0, u_offsetY: 0,
      u_worldWidth: 0, u_worldHeight: 0,
    },
    undefined,            // WebGL context attributes
    reduce ? 0 : 0.25     // speed
  )
</script>
'''

[[effect]]
key = "paper-grain-gradient"
name = "Grain Gradient"
library = "Paper Shaders"
url = "https://shaders.paper.design/grain-gradient"
package = "@paper-design/shaders-react"
version = "0.0.81"
license = "Apache-2.0"
category = "background"
stacks = ["react", "vanilla"]
vibes = ["organic", "editorial", "retro", "warm", "calm"]
cost = "light"
use_when = "Tactile, print-like color fields: editorial brands, wellness, creative studios."
avoid_when = "Data-dense product UIs; grain fights small text."
a11y = "aria-hidden wrapper; speed 0 when reduced motion is requested."
perf = "Single canvas; set maxPixelCount on very large screens. Shape 'blob' can render empty at scale 1; 'sphere', 'corners' and 'wave' are reliable."
vanilla = '''
<div id="specimen" aria-hidden="true" style="position:relative;aspect-ratio:4/5"></div>
<script type="module">
  import { ShaderMount, grainGradientFragmentShader, GrainGradientShapes, getShaderColorFromString,
           getShaderNoiseTexture, ShaderFitOptions } from 'https://cdn.jsdelivr.net/npm/@paper-design/shaders@0.0.81/+esm'

  const noise = getShaderNoiseTexture()
  await noise.decode()  // REQUIRED in vanilla: ShaderMount throws if the noise image is not loaded yet
  const reduce = matchMedia('(prefers-reduced-motion: reduce)')
  const colors = ['#e9a46c', '#c4472a', '#2f4a3f', '#f3dfb0'].map(getShaderColorFromString)
  const shader = new ShaderMount(document.getElementById('specimen'), grainGradientFragmentShader, {
    u_colorBack: getShaderColorFromString('#ede3d1'),
    u_colors: colors, u_colorsCount: colors.length,
    u_softness: 0.5, u_intensity: 0.5, u_noise: 0.35,
    u_shape: GrainGradientShapes.sphere,  // wave | dots | truchet | corners | ripple | blob | sphere
    u_noiseTexture: noise,
    u_fit: ShaderFitOptions.none, u_scale: 0.92, u_rotation: 0,
    u_originX: 0.5, u_originY: 0.5, u_offsetX: 0, u_offsetY: 0, u_worldWidth: 0, u_worldHeight: 0,
  }, undefined, reduce.matches ? 0 : 0.35)
  reduce.addEventListener('change', (e) => shader.setSpeed(e.matches ? 0 : 0.35))
</script>
'''
react = '''
import { GrainGradient } from '@paper-design/shaders-react'

<GrainGradient
  colors={['#e8d5b7', '#d9603b', '#2e4a3f']} // up to 7 colors
  colorBack="#f6f1e9"
  softness={0.5}   // 0..1 edge softness
  intensity={0.5}  // 0..1 distortion
  noise={0.25}     // 0..1 grain
  shape="corners"  // wave | dots | truchet | corners | ripple | blob | sphere
  speed={reduce ? 0 : 0.6}
  style={{ width: '100%', height: '100%' }}
/>
'''

