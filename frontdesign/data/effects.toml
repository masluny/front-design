[[effect]]
key = "ogl"
name = "OGL"
library = "OGL"
url = "https://github.com/oframe/ogl"
package = "ogl"
version = "1.0.11"
license = "Unlicense"
category = "background"
stacks = ["vanilla", "react"]
vibes = ["techy", "organic", "calm"]
cost = "medium"
use_when = "Hand-written fragment shaders with a tiny WebGL wrapper (many React Bits backgrounds use it)."
avoid_when = "You do not need custom GLSL."
a11y = "aria-hidden canvas; stop the RAF loop under reduced motion."
perf = "Small (about 8 to 30 kB depending on imports)."
vanilla = '''
import { Renderer, Program, Mesh, Triangle } from 'ogl'

const renderer = new Renderer({ dpr: Math.min(devicePixelRatio, 1.5) })
const gl = renderer.gl
document.querySelector('#bg').appendChild(gl.canvas)
const program = new Program(gl, {
  vertex: `attribute vec2 position; void main(){ gl_Position = vec4(position, 0., 1.); }`,
  fragment: `precision highp float; uniform float uTime; uniform vec2 uRes;
    void main(){ vec2 uv = gl_FragCoord.xy / uRes; gl_FragColor = vec4(uv, .5 + .5*sin(uTime), 1.); }`,
  uniforms: { uTime: { value: 0 }, uRes: { value: [innerWidth, innerHeight] } },
})
const mesh = new Mesh(gl, { geometry: new Triangle(gl), program })
renderer.setSize(innerWidth, innerHeight)
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
requestAnimationFrame(function loop(t) {
  program.uniforms.uTime.value = t * 0.001
  renderer.render({ scene: mesh })
  if (!reduce) requestAnimationFrame(loop)
})
'''

