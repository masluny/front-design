# Where to find professional reference sites.
#
# [[gallery]]  curated showcases; browse them, then `front-design capture` the sites you pick.
# [[exemplar]] individual sites widely cited for design quality, grouped by page type.
#              They are starting points, not a fixed list: always add the direct competitors
#              and 1-2 references from outside the category.
#
# login = true means the gallery needs an account (the agent should tell the user, not sign in).

[[gallery]]
key = "recent"
name = "Recent (formerly Godly)"
url = "https://recent.design/"
types = ["landing", "saas", "portfolio", "ecommerce"]
note = "Godly now redirects here (checked 2026-10-06). Curated web, motion, 3D and editorial work; items link to the work rather than listing URLs."
login = false

