# Curated expert sources for UI/UX research.
#
# kind:
#   research   = based on user studies / measured data (NN/g, Baymard, web.dev field data)
#   standard   = normative spec (WCAG, platform guidelines)
#   guideline  = design-system or institution guidance (GOV.UK, Material, Apple HIG)
#   craft      = respected practitioner writing (opinion backed by experience, not studies)
#   tool       = calculators and references used while designing
#
# Weigh them in that order when principles conflict: research > standard > guideline > craft.
# `topics` and `types` drive `front-design sources --type ...`; "*" means every page type.

# ---------------------------------------------------------------- usability / critique

